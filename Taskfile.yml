version: '3'

includes:
  api:
    taskfile: ./emgapi/Taskfile.yaml
    dir: ./emgapi
  client:
    taskfile: ./Taskfile.client.yml
    dir: ./ebi-metagenomics-client

# The upstream dev-data task uses the emgapiv2_appdb volume name.
env:
  COMPOSE_PROJECT_NAME: emgapiv2

tasks:
  dev-init:
    desc: Prepare local client settings and create API development data
    cmds:
      - task: client:configure
      - task: api:make-dev-data

  run:
    desc: Run the API services and client together
    cmds:
      - task --parallel --concurrency 0 --output prefixed api:run client:run open-browser

  open-browser:
    desc: Open the client and API pages in the browser
    cmds:
      - open http://localhost:9000/metagenomics/ http://localhost:8000

  stop:
    desc: Stop the API services
    cmds:
      - task: api:stop
